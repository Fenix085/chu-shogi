[project]
name = "chu-shogi"
version = "0.1.0"
description = "Chu-Shogi engine for playing and training bots"
readme = "README.md"
authors = [
    { name = "Fenix085", email = "vladimirhurtovyi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "keras>=3.15.1",
    "numpy>=2.5.4",
]

[project.scripts]
chu-shogi = "chu_shogi:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
