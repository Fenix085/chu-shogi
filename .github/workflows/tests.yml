name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install the project
        run: |
          if [ -f requirements.lock ] || [ -f pyproject.lock ]; then
            uv sync --locked
          else
            echo "No lock file found. Please add requirements.lock or pyproject.lock."
            exit 1
          fi
      
      - name: Run tests
        run: uv run pytest